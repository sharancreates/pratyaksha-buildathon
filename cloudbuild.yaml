steps:
  # 1. Continuous Security & Engine Testing
  - name: 'node:22-alpine'
    id: 'unit-tests'
    entrypoint: 'npm'
    args: ['test']

  # 2. Build Web BFF Container Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-web'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/pratyaksha-web:${COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/pratyaksha-web:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # 3. Build Python Geospatial Container Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-geo'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/pratyaksha-geo:${COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/pratyaksha-geo:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # 4. Push Container Images to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-web'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/pratyaksha-web'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-geo'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/pratyaksha-geo'

  # 5. Deploy Internal Python Geospatial Microservice to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-geo'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'pratyaksha-geo-service'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/pratyaksha-geo:${COMMIT_SHA}'
      - '--region=${_REGION}'
      - '--service-account=${_SA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--port=8000'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--ingress=internal-and-cloud-load-balancing'
      - '--vpc-connector=${_VPC_CONNECTOR}'
      - '--vpc-egress=private-ranges-only'
      - '--add-cloudsql-instances=${PROJECT_ID}:${_REGION}:${_DB_INSTANCE}'
      - '--no-allow-unauthenticated'
      - '--quiet'

  # 6. Deploy Public Web BFF Frontend Service to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-web'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        GEO_URL=$$(gcloud run services describe pratyaksha-geo-service --region="${_REGION}" --format="value(status.url)")
        gcloud run deploy pratyaksha-web-service \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/pratyaksha-web:${COMMIT_SHA}" \
          --region="${_REGION}" \
          --service-account="${_SA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com" \
          --cpu=1 \
          --memory=512Mi \
          --port=3000 \
          --min-instances=0 \
          --max-instances=10 \
          --ingress=all \
          --allow-unauthenticated \
          --set-env-vars="NODE_ENV=production,GEO_BACKEND_URL=$${GEO_URL}" \
          --quiet

  # 7. Automated Live Production Smoke Test
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke-test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        WEB_URL=$$(gcloud run services describe pratyaksha-web-service --region="${_REGION}" --format="value(status.url)")
        echo "Running live smoke verification against $${WEB_URL}..."
        bash scripts/gcp/11_smoke_test.sh "$${WEB_URL}"

substitutions:
  _REGION: 'asia-south1'
  _REPO_NAME: 'pratyaksha-repo'
  _VPC_CONNECTOR: 'pratyaksha-vpc-conn'
  _DB_INSTANCE: 'pratyaksha-db'
  _SA_NAME: 'sa-pratyaksha-runtime'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
